aid: uml
name: UML
description: >-
  UML (Unified Modeling Language) is the standard modeling language for software architecture, system design, and
  technical documentation. Governed by the Object Management Group (OMG), UML defines a set of notation conventions and
  diagram types — class, sequence, activity, use case, state, component, deployment, and more — used across the software
  development lifecycle. This collection profiles the ecosystem of tools, APIs, and services that work with UML diagrams
  programmatically.
